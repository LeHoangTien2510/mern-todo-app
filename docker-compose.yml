version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_todo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ReaTiMo
      MONGO_INITDB_ROOT_PASSWORD: hoangtien123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: always
    environment:
      - MONGO_URI=mongodb://ReaTiMo:hoangtien123@mongodb:27017/todo?authSource=admin
      - JWT_SECRET=BI_MAT
      - PORT=8000
    # THÊM PHẦN NÀY VÀO:
    volumes:
      - ./backend:/app
      - /app/node_modules # Giữ node_modules của Linux, không cho Windows đè vào
    depends_on:
      - mongodb
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    # THÊM PHẦN NÀY VÀO:
    volumes:
      - ./frontend:/app
      - /app/node_modules # Giữ node_modules của Linux
    depends_on:
      - backend

volumes:
  mongo_data: